<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<style>
/* ── Base earthBalance ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
body {
  background: #0a0f1e;
  color: #e2e8f0;
  font-family: system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 24px 24px 80px;
}
/* ── En-tête ────────────────────────────────────────────────────────────────── */
#page-header { text-align: center; margin-bottom: 32px; }
#page-header h1 {
  color: #00e5ff;
  font-size: 1.4rem;
  margin: 0 0 6px;
  line-height: 1.3;
}
#page-header .subtitle {
  color: #94a3b8;
  font-size: .82rem;
  margin: 0;
}
/* ── Grille ─────────────────────────────────────────────────────────────────── */
#charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
}
@media (max-width: 700px) { #charts-grid { grid-template-columns: 1fr; } }

/* ── Carte graphique ─────────────────────────────────────────────────────────── */
.card {
  background: #111827;
  border: 1px solid #1f2d3d;
  border-radius: 12px;
  padding: 20px;
}
.card h2 {
  color: #00e5ff;
  font-size: .95rem;
  margin: 0 0 4px;
  line-height: 1.35;
}
.card .source {
  color: #64748b;
  font-size: .72rem;
  margin: 0 0 14px;
}
.card .note {
  color: #94a3b8;
  font-size: .75rem;
  margin: 10px 0 0;
  line-height: 1.55;
}

/* ── Bouton panneau ──────────────────────────────────────────────────────────── */
#panel-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #00e5ff;
  color: #0a0f1e;
  border: none;
  border-radius: 24px;
  padding: 10px 18px;
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  z-index: 200;
  box-shadow: 0 2px 12px #00e5ff44;
  transition: background .2s;
}
#panel-btn:hover { background: #00ff88; }

/* ── Panneau latéral ─────────────────────────────────────────────────────────── */
#side-panel {
  position: fixed;
  top: 0;
  right: -460px;
  width: 440px;
  height: 100vh;
  background: #111827;
  border-left: 1px solid #1f2d3d;
  overflow-y: auto;
  transition: right .35s cubic-bezier(.4, 0, .2, 1);
  z-index: 100;
  padding: 24px 20px 40px;
}
#side-panel.open { right: 0; }
#panel-close {
  background: none;
  border: none;
  color: #94a3b8;
  font-size: 1.1rem;
  cursor: pointer;
  float: right;
  padding: 0;
  margin: 0 0 12px 0;
}
#panel-close:hover { color: #00e5ff; }

/* ── Contenu du panneau ──────────────────────────────────────────────────────── */
.panel-content h2 {
  color: #00e5ff;
  font-size: 1rem;
  margin: 0 0 14px;
  padding-top: 4px;
}
.panel-content h3 {
  color: #00ff88;
  font-size: .88rem;
  margin: 18px 0 6px;
  border-top: 1px solid #1f2d3d;
  padding-top: 10px;
}
.panel-content h4 {
  color: #facc15;
  font-size: .82rem;
  margin: 10px 0 4px;
}
.panel-content p {
  font-size: .8rem;
  color: #cbd5e1;
  line-height: 1.65;
  margin: 0 0 8px;
}
.panel-content blockquote {
  border-left: 3px solid #00e5ff;
  margin: 8px 0;
  padding: 4px 12px;
  color: #94a3b8;
  font-style: italic;
  font-size: .78rem;
  background: #0a0f1e;
  border-radius: 0 4px 4px 0;
}
.panel-content .cite {
  color: #64748b;
  font-size: .7rem;
}
.panel-content table {
  width: 100%;
  border-collapse: collapse;
  font-size: .75rem;
  margin: 10px 0;
}
.panel-content th {
  background: #1f2d3d;
  color: #00e5ff;
  padding: 5px 8px;
  text-align: left;
}
.panel-content td {
  padding: 5px 8px;
  border-bottom: 1px solid #1f2d3d;
  color: #cbd5e1;
}
.panel-content .warn {
  background: #ff505011;
  border: 1px solid #ff505044;
  border-radius: 6px;
  padding: 8px 10px;
  color: #fca5a5;
  font-size: .78rem;
  margin: 0 0 10px;
}
</style>
</head>
<body>

<!-- ── En-tête ──────────────────────────────────────────────────────────────── -->
<header id="page-header">
  <h1>__PAGE_TITLE__</h1>
  <p class="subtitle">__PAGE_SOURCES__</p>
</header>

<!-- ── Grille des graphiques ─────────────────────────────────────────────────── -->
<div id="charts-grid"></div>

<!-- ── Données Chart.js (JSON) ────────────────────────────────────────────────── -->
<script type="application/json" id="charts-data">
__CHARTS_JSON__
</script>

<!-- ── Panneau latéral ──────────────────────────────────────────────────────── -->
<button id="panel-btn"
        onclick="document.getElementById('side-panel').classList.toggle('open')"
        aria-expanded="false"
        aria-controls="side-panel">
  &#128203;&nbsp;Analyse GIEC
</button>

<aside id="side-panel" role="complementary" aria-label="Analyse GIEC">
  <button id="panel-close"
          onclick="document.getElementById('side-panel').classList.remove('open')"
          aria-label="Fermer le panneau">
    &#x2715; Fermer
  </button>
  <div class="panel-content">__COMMENTARY__</div>
</aside>

<!-- ── Chart.js (inline) ─────────────────────────────────────────────────────── -->
<script>/* __CHARTJS__ */</script>

<!-- ── Rendu des graphiques ──────────────────────────────────────────────────── -->
<script>
'use strict';

/* Valeurs par défaut earthBalance */
Chart.defaults.color       = '#94a3b8';
Chart.defaults.borderColor = '#1f2d3d';

/**
 * Convertit récursivement les chaînes "__fn__<expression JS>" en fonctions.
 * Permet de définir des callbacks Chart.js depuis un fichier JSON/Python dict.
 *
 * Exemple dans la config Python :
 *   "label": "__fn__(c) => c.parsed.x + ' gCO₂-eq/kWh'"
 */
function reviveFns(v) {
  if (typeof v === 'string' && v.startsWith('__fn__')) {
    // eslint-disable-next-line no-eval
    return eval(v.slice(6));
  }
  if (Array.isArray(v)) return v.map(reviveFns);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k in v) out[k] = reviveFns(v[k]);
    return out;
  }
  return v;
}

/* Lecture des données */
const chartsData = JSON.parse(
  document.getElementById('charts-data').textContent
);

/* Rendu de la grille */
const grid = document.getElementById('charts-grid');
chartsData.forEach(function(c, i) {
  const card = document.createElement('div');
  card.className = 'card';

  const h2     = document.createElement('h2');
  const source = document.createElement('p');
  const canvas = document.createElement('canvas');
  const note   = document.createElement('p');

  h2.textContent     = c.title;
  source.className   = 'source';
  source.textContent = c.source;
  canvas.id          = 'chart-' + i;
  canvas.height      = 260;
  note.className     = 'note';
  note.textContent   = c.note;

  card.appendChild(h2);
  card.appendChild(source);
  card.appendChild(canvas);
  card.appendChild(note);
  grid.appendChild(card);

  new Chart(canvas, reviveFns(JSON.parse(JSON.stringify(c.chartConfig))));
});

/* Panneau latéral : masquer si vide */
const panelContent = document.querySelector('.panel-content');
const panelBtn     = document.getElementById('panel-btn');
const sidePanel    = document.getElementById('side-panel');

if (!panelContent.textContent.trim()) {
  panelBtn.style.display = 'none';
}

/* Fermeture au clavier (Échap) */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    sidePanel.classList.remove('open');
    panelBtn.setAttribute('aria-expanded', 'false');
  }
});
panelBtn.addEventListener('click', function() {
  const isOpen = sidePanel.classList.contains('open');
  panelBtn.setAttribute('aria-expanded', String(!isOpen));
});
</script>

</body>
</html>
